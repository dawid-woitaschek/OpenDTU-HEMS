name: OpenDTU-HEMS Build

on:
  push:
    branches:
      - hems
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    branches:
      - hems
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - generic_esp32_8mb
          - generic_esp32_16mb_psram
          - generic_esp32s3
          - generic_esp32s3_usb
          - generic_esp32s3_usb_octal_psram
          - generic_esp32s3_usb_quad_psram
          - opendtufusionv2
          - opendtufusionv2_poe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Enable Corepack
        working-directory: webapp
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install WebApp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Build WebApp
        working-directory: webapp
        run: yarn build

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Prepare firmware artifacts
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_dir=".pio/build/${{ matrix.environment }}"
          mv "${build_dir}/firmware.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.bin"
          mv "${build_dir}/firmware.factory.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.factory.bin"
          ls -lh "${build_dir}"/opendtu-hems-*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opendtu-hems-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/opendtu-hems-*.bin
          if-no-files-found: error
