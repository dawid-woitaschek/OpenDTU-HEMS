name: OpenDTU-HEMS Build

on:
  push:
    branches:
      - hems
      - integration/hems-next
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    branches:
      - hems
      - integration/hems-next
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - generic_esp32_8mb
          - generic_esp32_16mb_psram
          - generic_esp32s3
          - generic_esp32s3_usb
          - generic_esp32s3_usb_octal_psram
          - generic_esp32s3_usb_quad_psram
          - opendtufusionv2
          - opendtufusionv2_poe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Enable Corepack
        working-directory: webapp
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install WebApp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Build WebApp
        working-directory: webapp
        run: yarn build

      - name: Test HEMS Admin save behavior
        if: matrix.environment == 'generic_esp32s3_usb'
        run: |
          node test/test_hems_admin.mjs
          node test/test_tariff_units.mjs

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Test HEMS configuration compatibility
        if: matrix.environment == 'generic_esp32s3_usb'
        run: python test/test_hems_config.py .pio/libdeps/generic_esp32s3_usb/ArduinoJson/src

      - name: Test firmware update channel configuration
        if: matrix.environment == 'generic_esp32s3_usb'
        run: python test/test_firmware_channels.py

      - name: Prepare firmware artifacts
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_dir=".pio/build/${{ matrix.environment }}"
          mv "${build_dir}/firmware.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.bin"
          mv "${build_dir}/firmware.factory.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.factory.bin"
          ls -lh "${build_dir}"/opendtu-hems-*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opendtu-hems-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/opendtu-hems-*.bin
          if-no-files-found: error

  publish_firmware_channel:
    name: Publish firmware update channel
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7

      - name: Resolve update channel
        id: channel
        shell: bash
        run: |
          mapfile -t channel_data < <(python - <<'PY'
          import json
          import os
          import re

          with open('firmware-channels.json', 'r', encoding='utf-8') as fp:
              config = json.load(fp)

          repository = config.get('repository')
          if repository != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit(f"firmware-channels.json repository mismatch: {repository!r}")

          event_name = os.environ['GITHUB_EVENT_NAME']
          if event_name == 'pull_request':
              with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as fp:
                  event = json.load(fp)
              pull_request = event.get('pull_request') or {}
              head = pull_request.get('head') or {}
              head_repo = (head.get('repo') or {}).get('full_name')
              number = event.get('number')
              branch = head.get('ref')
              if head_repo != repository:
                  raise SystemExit('Temporary update channels are only published for same-repository pull requests')
              if not isinstance(number, int) or number < 1 or not isinstance(branch, str) or not branch:
                  raise SystemExit('Invalid pull request metadata for firmware update channel')
              channel_id = f'pr-{number}'
          else:
              branch = os.environ['GITHUB_REF_NAME']
              entry = config.get('channels', {}).get(branch)
              if not isinstance(entry, dict):
                  raise SystemExit(f"No firmware update channel configured for branch {branch!r}")
              channel_id = entry.get('id', '')

          if not isinstance(channel_id, str) or not re.fullmatch(r'[A-Za-z0-9._-]+', channel_id):
              raise SystemExit(f"Invalid firmware update channel id: {channel_id!r}")
          print(channel_id)
          print(branch)
          PY
          )
          channel_id="${channel_data[0]}"
          source_branch="${channel_data[1]}"
          echo "id=${channel_id}" >> "$GITHUB_OUTPUT"
          echo "branch=firmware-channel-${channel_id}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${source_branch}" >> "$GITHUB_OUTPUT"

      - name: Download firmware build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/firmware-artifacts

      - name: Prepare rolling channel snapshot
        shell: bash
        env:
          CHANNEL_ID: ${{ steps.channel.outputs.id }}
          CHANNEL_BRANCH: ${{ steps.channel.outputs.branch }}
          SOURCE_BRANCH: ${{ steps.channel.outputs.source_branch }}
          SOURCE_COMMIT: ${{ github.sha }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          artifact_root="$RUNNER_TEMP/firmware-artifacts"
          dist="$RUNNER_TEMP/firmware-dist"
          rm -rf "$dist"
          mkdir -p "$dist"

          shopt -s nullglob
          for artifact_dir in "$artifact_root"/opendtu-hems-*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name="$(basename "$artifact_dir")"
            environment="${artifact_name#opendtu-hems-}"
            ota_file=""
            for candidate in "$artifact_dir"/opendtu-hems-"$environment"-*.bin; do
              [[ "$candidate" == *.factory.bin ]] && continue
              ota_file="$candidate"
              break
            done
            if [ -z "$ota_file" ]; then
              echo "No OTA binary found for $environment" >&2
              exit 1
            fi
            cp "$ota_file" "$dist/opendtu-hems-${environment}.bin"
          done

          if ! compgen -G "$dist/opendtu-hems-*.bin" > /dev/null; then
            echo "No OTA binaries collected" >&2
            exit 1
          fi

          export DIST="$dist"
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          dist = pathlib.Path(os.environ['DIST'])
          builds = {}
          for path in sorted(dist.glob('opendtu-hems-*.bin')):
              environment = path.name[len('opendtu-hems-'):-len('.bin')]
              md5 = hashlib.md5()
              sha256 = hashlib.sha256()
              with path.open('rb') as fp:
                  while chunk := fp.read(1024 * 1024):
                      md5.update(chunk)
                      sha256.update(chunk)
              builds[environment] = {
                  'file': path.name,
                  'size': path.stat().st_size,
                  'md5': md5.hexdigest(),
                  'sha256': sha256.hexdigest(),
              }

          manifest = {
              'schema': 'opendtu-hems-update/v1',
              'repository': os.environ['UPDATE_REPOSITORY'],
              'channel': os.environ['CHANNEL_ID'],
              'branch': os.environ['SOURCE_BRANCH'],
              'commit': os.environ['SOURCE_COMMIT'],
              'published_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'builds': builds,
          }
          with (dist / 'manifest.json').open('w', encoding='utf-8') as fp:
              json.dump(manifest, fp, indent=2, sort_keys=True)
              fp.write('\n')

          (dist / 'README.md').write_text(
              '# Generated firmware update channel\n\n'
              f"Source branch: `{os.environ['SOURCE_BRANCH']}`  \n"
              f"Source commit: `{os.environ['SOURCE_COMMIT']}`  \n"
              f"Update channel: `{os.environ['CHANNEL_ID']}`\n\n"
              'This branch is generated by GitHub Actions and force-replaced on each successful source revision build.\n',
              encoding='utf-8',
          )
          PY

          ls -lh "$dist"

      - name: Publish rolling channel branch
        shell: bash
        env:
          CHANNEL_BRANCH: ${{ steps.channel.outputs.branch }}
          SOURCE_BRANCH: ${{ steps.channel.outputs.source_branch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          dist="$RUNNER_TEMP/firmware-dist"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$CHANNEL_BRANCH"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$dist"/. .
          git add manifest.json README.md opendtu-hems-*.bin
          git commit -m "firmware: publish ${SOURCE_BRANCH} ${SOURCE_COMMIT::7}"
          git push --force origin "HEAD:refs/heads/${CHANNEL_BRANCH}"

  generate_pr_artifacts_comment:
    name: Generate PR artifact index
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Generate artifact links
        id: artifact-links
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId,
              }
            );

            const firmwareArtifacts = artifacts
              .filter((artifact) => artifact.name.startsWith('opendtu-hems-'))
              .sort((a, b) => a.name.localeCompare(b.name));

            if (!firmwareArtifacts.length) {
              core.setFailed('No OpenDTU-HEMS firmware artifacts found');
              return;
            }

            const prChannel = `pr-${context.issue.number}`;
            let body = '### Direct OTA binaries\n\n';
            body += 'Raw OTA images for this pull request, no ZIP extraction required:\n\n';
            for (const artifact of firmwareArtifacts) {
              const environment = artifact.name.replace(/^opendtu-hems-/, '');
              body += `* [${environment}.bin](https://raw.githubusercontent.com/${owner}/${repo}/firmware-channel-${prChannel}/opendtu-hems-${environment}.bin)\n`;
            }

            body += '\n### ZIP artifacts (fallback)\n\n';
            for (const artifact of firmwareArtifacts) {
              body += `* [${artifact.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${artifact.id}.zip)\n`;
            }

            body += '\n### Notice\n';
            body += `* The direct OTA images follow temporary update channel \`${prChannel}\`.\n`;
            body += '* Use the normal `.bin` for OTA. Factory images remain available only inside the fallback ZIP artifacts.\n';
            body += `* Built from workflow commit \`${context.sha}\`.\n`;

            core.setOutput('body', body);

      - name: Store PR artifact index
        shell: bash
        env:
          COMMENT_BODY: ${{ steps.artifact-links.outputs.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr
          printf '%s\n' "$COMMENT_BODY" > "pr/${PR_NUMBER}.md"

      - name: Upload PR artifact index
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: pr/
          retention-days: 1
          overwrite: true
