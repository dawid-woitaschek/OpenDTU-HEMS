name: OpenDTU-HEMS Build

on:
  push:
    branches:
      - hems
    paths-ignore:
      - docs/**
      - '**/*.md'
  pull_request:
    branches:
      - hems
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - generic_esp32_8mb
          - generic_esp32_16mb_psram
          - generic_esp32s3
          - generic_esp32s3_usb
          - generic_esp32s3_usb_octal_psram
          - generic_esp32s3_usb_quad_psram
          - opendtufusionv2
          - opendtufusionv2_poe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Enable Corepack
        working-directory: webapp
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install WebApp dependencies
        working-directory: webapp
        run: yarn install --frozen-lockfile

      - name: Build WebApp
        working-directory: webapp
        run: yarn build

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Test HEMS configuration compatibility
        if: matrix.environment == 'generic_esp32s3_usb'
        run: python test/test_hems_config.py .pio/libdeps/generic_esp32s3_usb/ArduinoJson/src

      - name: Prepare firmware artifacts
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_dir=".pio/build/${{ matrix.environment }}"
          mv "${build_dir}/firmware.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.bin"
          mv "${build_dir}/firmware.factory.bin" "${build_dir}/opendtu-hems-${{ matrix.environment }}-${short_sha}.factory.bin"
          ls -lh "${build_dir}"/opendtu-hems-*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opendtu-hems-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/opendtu-hems-*.bin
          if-no-files-found: error

  generate_pr_artifacts_comment:
    name: Generate PR artifact index
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Generate artifact links
        id: artifact-links
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId,
              }
            );

            const firmwareArtifacts = artifacts
              .filter((artifact) => artifact.name.startsWith('opendtu-hems-'))
              .sort((a, b) => a.name.localeCompare(b.name));

            if (!firmwareArtifacts.length) {
              core.setFailed('No OpenDTU-HEMS firmware artifacts found');
              return;
            }

            let body = '### OpenDTU-HEMS Build Artifacts\n\n';
            body += 'Firmware built from this pull request:\n\n';

            for (const artifact of firmwareArtifacts) {
              body += `* [${artifact.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${artifact.id}.zip)\n`;
            }

            body += '\n### Notice\n';
            body += '* Each ZIP contains the OTA binary and the factory binary for that target. Extract the ZIP before flashing.\n';
            body += '* Use the normal `.bin` for a compatible OTA update. Use `.factory.bin` only for a full factory flash when appropriate.\n';
            body += `* [Successful HEMS build run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})\n`;
            body += `* Built from workflow commit \`${context.sha}\`.\n`;

            core.setOutput('body', body);

      - name: Store PR artifact index
        shell: bash
        env:
          COMMENT_BODY: ${{ steps.artifact-links.outputs.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr
          printf '%s\n' "$COMMENT_BODY" > "pr/${PR_NUMBER}.md"

      - name: Upload PR artifact index
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: pr/
          retention-days: 1
          overwrite: true
