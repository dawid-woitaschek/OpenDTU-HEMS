name: OpenDTU-OnBattery Tests

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - docs/**
      - '**/*.md'
    branches:
      - master
      - development
    tags-ignore:
      - 'v**'
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Checkout existing ArduinoJson dependency for native profile tests
        uses: actions/checkout@v7
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: work/ArduinoJson

      - name: Run tests
        run: |
          cd test
          make clean
          make test ARDUINOJSON=../work/ArduinoJson/src

      - name: Test production HEMS JSON configuration helpers
        run: python3 test/test_hems_config.py work/ArduinoJson/src
